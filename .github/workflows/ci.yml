name: CI

# The same checks as the Jenkins pipeline (which also builds the image and deploys): web app,
# API (the integration test runs on Oracle XE in Docker here) and the mock ↔ API contract.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run validate
      - run: npm run build:api
      - uses: actions/upload-artifact@v4
        with:
          name: web-app
          path: frontend/dist

  backend:
    needs: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web-app
          path: frontend/dist
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: ./mvnw -B verify
        working-directory: backend
      - uses: actions/upload-artifact@v4
        with:
          name: cerebro-jar
          path: backend/target/cerebro.jar

  contract:
    needs: backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: cerebro-jar
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Start the API (H2, demo data)
        run: |
          nohup java -jar cerebro.jar --spring.profiles.active=h2 > api.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:8080/actuator/health/readiness && exit 0
            sleep 2
          done
          cat api.log; exit 1
      - run: npx vitest run src/services/http/apiContract.test.ts
        working-directory: frontend
        env:
          CEREBRO_API_URL: http://localhost:8080
