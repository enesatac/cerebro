# Local development on Oracle Database Free from docker compose (repo root), no identity provider:
# the sign-in screen lists the accounts and an empty database gets the demo organisation.
spring:
  datasource:
    url: jdbc:oracle:thin:@//localhost:1521/FREEPDB1
    username: cerebro
    password: cerebro-local

server:
  servlet:
    session:
      cookie:
        secure: false

cerebro:
  demo-data: true
  security:
    demo-sign-in: true
    bootstrap-admin-email: gelistirici@cerebro.local
