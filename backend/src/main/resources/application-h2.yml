# No database server at all: H2 in Oracle compatibility mode, in memory (or CEREBRO_H2_URL, e.g.
# jdbc:h2:file:./target/cerebro;MODE=Oracle to keep data). Same migrations, demo data and demo
# sign-in as `local`. For trying the app, the frontend contract test and CI — never production.
spring:
  datasource:
    url: ${CEREBRO_H2_URL:jdbc:h2:mem:cerebro;MODE=Oracle;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1}
    username: sa
    password: ""

server:
  servlet:
    session:
      cookie:
        secure: false

cerebro:
  demo-data: true
  security:
    demo-sign-in: true
    bootstrap-admin-email: gelistirici@cerebro.local
